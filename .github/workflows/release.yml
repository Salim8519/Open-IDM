name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (e.g. 0.1.0) — builds artifacts only, no release"
        required: true

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 ./...

  cli:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile CLI
        shell: bash
        run: |
          V="${VERSION#v}"
          mkdir -p out
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""; [ "$os" = windows ] && ext=".exe"
            name="peregrine-cli-${V}-${os}-${arch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/Salim8519/Open-IDM/engine.Version=${V}" \
              -o "build/$name/peregrine${ext}" ./cmd/peregrine
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then (cd build && zip -qr "../out/$name.zip" "$name"); else tar -C build -czf "out/$name.tar.gz" "$name"; fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: cli
          path: out/*

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Wails (same version as desktop/go.mod)
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(cd desktop && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: Build app + installer
        shell: bash
        working-directory: desktop
        run: |
          V="${VERSION#v}"
          # The host must exist before the installer is built (project.nsi bundles it).
          mkdir -p build/bin
          CGO_ENABLED=0 go -C .. build -trimpath -ldflags "-s -w -X github.com/Salim8519/Open-IDM/engine.Version=${V}" -o desktop/build/bin/peregrine-host.exe ./cmd/peregrine-host
          wails build -platform windows/amd64 -nsis -webview2 download \
            -ldflags "-X github.com/Salim8519/Open-IDM/engine.Version=${V}"
      - name: Package
        shell: bash
        run: |
          V="${VERSION#v}"
          mkdir -p out portable/Peregrine
          cp desktop/build/bin/*installer*.exe "out/Peregrine-${V}-windows-x64-setup.exe"
          cp desktop/build/bin/Peregrine.exe desktop/build/bin/peregrine-host.exe LICENSE portable/Peregrine/
          (cd portable && 7z a -tzip "../out/Peregrine-${V}-windows-x64-portable.zip" Peregrine >/dev/null)
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Wails (same version as desktop/go.mod)
        run: go install github.com/wailsapp/wails/v2/cmd/wails@$(cd desktop && go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)
      - name: Build app (universal)
        working-directory: desktop
        run: |
          V="${VERSION#v}"
          wails build -clean -platform darwin/universal -ldflags "-X github.com/Salim8519/Open-IDM/engine.Version=${V}"
      - name: Add native messaging host + sign ad-hoc
        run: |
          V="${VERSION#v}"
          APP=desktop/build/bin/Peregrine.app
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/Salim8519/Open-IDM/engine.Version=${V}" -o /tmp/peregrine-host-$arch ./cmd/peregrine-host
          done
          lipo -create -output "$APP/Contents/MacOS/peregrine-host" /tmp/peregrine-host-amd64 /tmp/peregrine-host-arm64
          codesign --force --deep --sign - "$APP"
      - name: Make DMG
        run: |
          V="${VERSION#v}"
          mkdir -p out dmg
          cp -R desktop/build/bin/Peregrine.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Peregrine" -srcfolder dmg -ov -format UDZO "out/Peregrine-${V}-macos-universal.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/*

  extension:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip extension
        run: |
          V="${VERSION#v}"
          mkdir -p out
          cd extension
          zip -qr "../out/Peregrine-${V}-chromium-extension.zip" . -x 'node_modules/*' -x 'tests/*' -x 'package*.json' -x 'playwright*' -x 'test-results/*' -x '.gitignore'
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: out/*

  release:
    needs: [cli, windows, macos, extension]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign provenance with GitHub's OIDC identity
      attestations: write # publish the provenance attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest build provenance
        # Signed statement that every file was built by this workflow from this commit.
        # Verify with: gh attestation verify <file> -R Salim8519/Open-IDM
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "artifacts/*"
      - name: Release notes
        run: |
          V="${VERSION#v}"
          awk "/^## \\[?${V//./\\.}\\]?/{f=1;next} /^## /{f=0} f" docs/CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Peregrine ${V}" > notes.md
          cat docs/RELEASE_FOOTER.md >> notes.md 2>/dev/null || true
      - uses: softprops/action-gh-release@v2
        with:
          name: Peregrine ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
          files: artifacts/*
