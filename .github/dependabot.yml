# Keep dependencies patched. Each update arrives as a PR that must pass CI, the
# vulnerability scans and CodeQL before it can be merged.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: gomod
    directory: /desktop
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /desktop/frontend
    schedule: { interval: weekly }
    groups:
      dev-tooling:
        dependency-type: development
  - package-ecosystem: npm
    directory: /extension
    schedule: { interval: monthly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
