<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Strict CSP: the UI may only run code it ships with and talk to its own origin.
      No remote scripts, no eval, no plugins, no forms posting elsewhere. A filename or page
      title from a malicious server can never turn into running code.
      style-src needs 'unsafe-inline' only for React style attributes (progress widths).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="./src/logo.svg" />
    <title>Peregrine</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
