<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Peregrine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0B1020" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <g fill="#FFFFFF" filter="url(#shadow)">
    <!-- a peregrine falcon in a head-first dive, read as a download arrow -->
    <!-- body: rounded at the top (back), sharp at the bottom (beak) -->
    <path d="M256 84c30 0 50 24 50 54 0 70-30 150-50 232-20-82-50-162-50-232 0-30 20-54 50-54z"/>
    <!-- wings folded back into a chevron that meets the beak -->
    <path d="M70 132c78 10 136 56 170 128l16 110C196 288 140 210 70 132z"/>
    <path d="M442 132c-78 10-136 56-170 128l-16 110c60-82 116-160 186-238z"/>
    <!-- landing tray -->
    <rect x="164" y="410" width="184" height="30" rx="15"/>
  </g>
</svg>
